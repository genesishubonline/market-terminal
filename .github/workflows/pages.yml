# Every 2 hours: fetch prices + headlines, deploy the static site to GitHub Pages.
# No AI, no secrets, no commits. brief.json is whatever is committed on main.
name: Build and deploy

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours, UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch prices and headlines
        run: python fetch.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html data.json manifest.webmanifest _site/
          cp -r icons _site/
          [ -f brief.json ] && cp brief.json _site/ || echo "no brief.json yet"
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
