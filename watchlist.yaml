rss:
  # tabs: which headline tabs a feed appears in (japan, us, crypto, tech, regulation)
  - name: 日経
    tabs: [japan]
    # nikkei.com has no public RSS. Google News search scoped to nikkei.com, 市場 (markets) query.
    url: "https://news.google.com/rss/search?q=site:nikkei.com+%E5%B8%82%E5%A0%B4&hl=ja&gl=JP&ceid=JP:ja"
  - name: Nikkei Asia
    tabs: [japan]
    url: https://asia.nikkei.com/rss/feed/nar
  - name: NHK 経済
    tabs: [japan]
    url: https://www.nhk.or.jp/rss/news/cat5.xml
  - name: 日銀 新着
    tabs: [japan, regulation]
    url: https://www.boj.or.jp/rss/whatsnew.xml
  - name: Reuters Business
    tabs: [us]
    # Reuters has no public RSS. This is a Google News search feed scoped to reuters.com/business.
    url: "https://news.google.com/rss/search?q=site:reuters.com/business&hl=en-US&gl=US&ceid=US:en"
  - name: CoinDesk
    tabs: [crypto]
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
  - name: The Block
    tabs: [crypto]
    url: https://www.theblock.co/rss.xml
  - name: TechCrunch AI
    tabs: [tech]
    url: https://techcrunch.com/category/artificial-intelligence/feed/
  - name: SEC Press Releases
    tabs: [regulation, us]
    url: https://www.sec.gov/news/pressreleases.rss
  - name: FSA 新着情報
    tabs: [regulation, japan]
    url: https://www.fsa.go.jp/fsaNewsListAll_rss2.xml

settings:
  items_per_feed: 15
  fiat: [usd, jpy]
  history_days: 7      # sparkline window
  history_points: 90   # max points kept per series in data.json
