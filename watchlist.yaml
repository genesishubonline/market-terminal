# Watchlist for fetch.py. Public data only, no keys.
# Add stocks under `stocks:` using the same shape as `indices:`.

crypto:
  # coingecko_id: spot price. yahoo_ticker (default SYMBOL-USD): 7-day history via yfinance.
  - symbol: BTC
    name: Bitcoin
    coingecko_id: bitcoin
  - symbol: ETH
    name: Ethereum
    coingecko_id: ethereum
  - symbol: SOL
    name: Solana
    coingecko_id: solana

indices:
  # Yahoo Finance tickers, fetched via yfinance
  - symbol: N225
    name: Nikkei 225
    ticker: "^N225"
  - symbol: TOPIX
    name: TOPIX
    # Yahoo has no TOPIX index ticker. NEXT FUNDS TOPIX ETF tracks it closely.
    ticker: "1306.T"
    note: "proxy: NEXT FUNDS TOPIX ETF (1306.T)"
  - symbol: SPX
    name: S&P 500
    ticker: "^GSPC"
  - symbol: IXIC
    name: Nasdaq Composite
    ticker: "^IXIC"
  - symbol: KOSPI
    name: KOSPI
    ticker: "^KS11"
  - symbol: USDJPY
    name: USD/JPY
    ticker: "JPY=X"

stocks: []

# Macro series: charted in the brief when relevant, not shown as tiles.
macro:
  - symbol: US10Y
    name: US 10Y yield
    ticker: "^TNX"
    unit: "%"
  - symbol: VIX
    name: VIX
    ticker: "^VIX"
  - symbol: DXY
    name: Dollar index
    ticker: "DX-Y.NYB"
  - symbol: GOLD
    name: Gold
    ticker: "GC=F"
    unit: "$/oz"
  - symbol: WTI
    name: WTI crude
    ticker: "CL=F"
    unit: "$/bbl"
  # - symbol: 7203
  #   name: Toyota
  #   ticker: "7203.T"

